<!doctype html><html lang="en"><meta charset="utf-8"><style>
body{font:14px/1.5 system-ui,sans-serif;background:#f5f3ed;color:#222d2a;padding:20px;margin:0}h1{font-size:22px;margin:0 0 12px}p{color:#59645e}button{border:0;background:#a1442a;color:white;padding:12px 16px;border-radius:5px;font:inherit;cursor:pointer;width:100%;margin:12px 0}label{display:block}#status{font-size:12px;min-height:36px}
</style><h1>Take your board with you.</h1><p>Export objects, text styles, line layout, and images for Board Bridge. Nothing is changed or sent over the network.</p><label><input id="selection" type="checkbox"> Export selection only</label><button id="export">Download board JSON</button><p id="status" role="status"></p><script>
document.getElementById('export').onclick=()=>{document.getElementById('status').textContent='Reading text layout and images…';parent.postMessage({pluginMessage:{type:'export',selection:document.getElementById('selection').checked}},'*')};
onmessage=(event)=>{const m=event.data.pluginMessage;if(!m)return;const s=document.getElementById('status');if(m.type==='error'){s.textContent=m.message;return}if(m.type==='exported'){const url=URL.createObjectURL(new Blob([JSON.stringify(m.data)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=(m.name||'board').replace(/[^a-z0-9-_ ]/gi,'-')+'.boardbridge.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);s.textContent=m.data.nodes.length+' objects exported. Upload this file in Board Bridge.'}};
</script></html>
